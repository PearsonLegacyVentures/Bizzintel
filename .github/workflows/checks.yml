name: BizzIntel public site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: npm run check
      - name: Build public site
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Verify Cloudflare publishing output
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/site.js
          test -s dist/_headers
          test -s dist/robots.txt
          test -s dist/guides/index.html
          test -s dist/start-here/index.html
          test -s dist/resources/index.html
          test -s dist/about/index.html
          test -s dist/guides/ideation/index.html
          test -s dist/guides/planning/index.html
